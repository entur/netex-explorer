name: Update NeTEx data

on:
  schedule:
    # Run at 02:00 UTC every night
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI
    inputs:
      max_requests:
        description: 'Maks antall Gemini-kall i explain-jobben (standard 2000; hev for første fulle kjøring)'
        required: false
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch NeTEx schema
        run: npm run fetch-schema
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Parser tests and invariants for the generated data; a failure stops the commit
      - name: Check generated data
        run: npx vitest run scripts

      - name: Commit updated data files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # KI-tekster skal bare nå main via en PR et menneske har merget
          git add public/data ':!public/data/explanations-*.json'
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update NeTEx data [skip ci]"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # The data commit uses [skip ci], so deploy-pages.yml is not triggered by the push.
  # Deploy explicitly when new data was committed.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  # Genererer norske KI-forklaringer og legger dem i en PR (aldri direkte på main).
  # Kjører etter update også når ingen data er endret. Feiler jobben, påvirkes ikke update/deploy.
  # Kjører i GitHub-miljøet prd som prd-tjenestekontoen fra .entur/cicd.yaml (Workload Identity via
  # cloud-auth, ingen nøkler). Repo-variabelen EXPLAIN_ENABLED er av/på-bryteren for modellkallene.
  # Bare betrodd kode fra main: en manuell kjøring mot en annen gren ville kjørt den grenens
  # arbeidsflyt med skyidentiteten.
  explain:
    needs: update
    concurrency:
      group: ki-forklaringer
      cancel-in-progress: false
    if: ${{ vars.EXPLAIN_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Hent hurtigbufferen fra den åpne PR-grenen, så uferdig arbeid og rettelser ikke går tapt.
      # Versjonsfilene beholdes fra main, så PR-oppsummeringen sammenlignes mot main.
      - name: Restore cache from open PR branch
        run: |
          git fetch --depth=1 origin ki-forklaringer \
            && git checkout FETCH_HEAD -- data/explanations-cache.json \
            || echo "Ingen åpen ki-forklaringer-branch"

      - name: Authenticate to Google Cloud
        uses: entur/gha-meta/.github/actions/cloud-auth@c14eef7f4d90ed1be2c1df4dfb0927322bcbb3ba   # v1.9.0
        with:
          environment: prd
          gcp_workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Generate explanations
        run: npm run explain
        env:
          # Prosjektet kommer fra .entur/netex.yaml (metadata.id netex)
          GOOGLE_CLOUD_PROJECT: ent-netex-prd
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'eu' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.7-flash' }}
          MAX_REQUESTS: ${{ inputs.max_requests || '2000' }}

      - name: Check explain scripts
        run: npx vitest run scripts/explain

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ki-forklaringer
          base: main
          title: 'chore: KI-genererte forklaringer'
          body-path: explain-summary.md
          add-paths: |
            data/explanations-cache.json
            public/data/explanations-*.json
          commit-message: 'chore: oppdater KI-genererte forklaringer'
          delete-branch: true
