name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Called by update-data.yml after it has committed new data.
  # Its commit uses [skip ci], so the push above does not fire for it.
  workflow_call:

permissions:
  contents: read

# One deploy at a time; a newer run waits instead of cancelling one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Always build the tip of main, also when called right after update-data.yml pushed
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          # Project pages are served under /<repo>/, e.g. https://entur.github.io/netex-explorer/
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
